<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYT — Session Check-In</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}a{color:inherit;text-decoration:none}
    :root{--black:#080808;--white:#fff;--orange:#FF4400;--rule:rgba(255,255,255,0.1)}
    body{background:var(--black);color:var(--white);font-family:'Space Mono',monospace;min-height:100vh}
    nav{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule)}
    .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.1em}
    .badge{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);border:1px solid var(--orange);padding:6px 14px}
    .lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;padding:40px 24px}
    .lock h2{font-family:'Bebas Neue',sans-serif;font-size:36px}
    .lock input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:var(--white);font-family:'Space Mono',monospace;font-size:13px;padding:14px 20px;outline:none;width:100%;max-width:280px;text-align:center;letter-spacing:0.3em}
    .lock button{background:var(--orange);border:none;color:var(--white);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;padding:14px 32px;cursor:pointer;width:100%;max-width:280px}
    .err{font-size:10px;letter-spacing:0.2em;color:var(--orange);display:none}
    .app{display:none}
    .header{padding:40px 24px 24px;border-bottom:1px solid var(--rule)}
    .header h1{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:0.9;margin-bottom:12px}
    .header p{font-size:10px;letter-spacing:0.3em;color:rgba(255,255,255,0.35);text-transform:uppercase}
    .bar{padding:16px 24px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--rule);font-size:10px;letter-spacing:0.35em;color:rgba(255,255,255,0.4);text-transform:uppercase}
    .item{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.15s}
    .item:hover{background:rgba(255,255,255,0.03)}
    .item.on{background:rgba(255,68,0,0.08)}
    .box{width:28px;height:28px;border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;font-size:14px}
    .item.on .box{background:var(--orange);border-color:var(--orange)}
    .info{flex:1}
    .iname{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.05em;line-height:1}
    .ihandle{font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.35);margin-top:3px}
    .inum{font-family:'Bebas Neue',sans-serif;font-size:28px;color:rgba(255,255,255,0.2);text-align:right;flex-shrink:0}
    .item.on .inum{color:var(--orange)}
    .foot{position:fixed;bottom:0;left:0;right:0;padding:16px 24px;background:rgba(8,8,8,0.97);border-top:1px solid var(--rule);display:flex;gap:12px;align-items:center}
    .cnt{font-size:11px;letter-spacing:0.2em;color:rgba(255,255,255,0.4);flex:1}
    .sbtn{background:var(--orange);border:none;color:var(--white);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;padding:14px 24px;cursor:pointer;transition:opacity 0.2s}
    .sbtn:disabled{opacity:0.3;cursor:not-allowed}
    .overlay{position:fixed;inset:0;background:rgba(8,8,8,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;z-index:200;gap:16px}
    .overlay.show{display:flex}
    .big{font-family:'Bebas Neue',sans-serif;font-size:80px;color:var(--orange);line-height:1}
    .overlay h2{font-family:'Bebas Neue',sans-serif;font-size:36px}
    .overlay p{font-size:11px;letter-spacing:0.3em;color:rgba(255,255,255,0.4);text-transform:uppercase;line-height:2}
    .overlay button{background:var(--white);border:none;color:var(--black);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;padding:14px 32px;cursor:pointer;margin-top:16px}
    .pb{margin-top:100px}
    .loading{text-align:center;padding:60px 24px;font-size:10px;letter-spacing:0.3em;color:rgba(255,255,255,0.3);text-transform:uppercase}
  </style>
</head>
<body>
<nav><div class="nav-logo">DYT.</div><div class="badge">Admin Check-In</div></nav>

<div class="lock" id="lockScreen">
  <h2>Admin Only.</h2>
  <input type="password" id="pin" placeholder="ENTER PIN" onkeydown="if(event.key==='Enter')checkPin()">
  <button onclick="checkPin()">Enter →</button>
  <div class="err" id="err">Wrong pin. Try again.</div>
</div>

<div class="app" id="app">
  <div class="header"><h1>Today's<br>Session.</h1><p id="dt"></p></div>
  <div class="bar">Tap each member who showed up today</div>
  <div id="list"><div class="loading">Loading members...</div></div>
  <div class="pb"></div>
  <div class="foot">
    <div class="cnt" id="cnt">0 checked in</div>
    <button class="sbtn" id="sbtn" onclick="submit()" disabled>Save Session →</button>
  </div>
</div>

<div class="overlay" id="ov">
  <div class="big" id="ovIcon">🏆</div>
  <h2 id="ovTitle"></h2>
  <p id="ovMsg"></p>
  <button onclick="nextMilestone()">Continue →</button>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxdBHQFlilZppJ2YulebHGemaxeHB4CFk3IroKwltpcb9u6u4XdPWewMYo-7KH09K8g/exec';
const PIN='dyt2026';
let members=[],checked=new Set(),queue=[];

function checkPin(){
  if(document.getElementById('pin').value===PIN){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    load();
  }else{document.getElementById('err').style.display='block'}
}

async function load(){
  try{
    const r=await fetch(API+'?action=all');
    members=await r.json();
    members.sort((a,b)=>a.name.localeCompare(b.name));
    render();
  }catch(e){document.getElementById('list').innerHTML='<div class="loading">Error loading — check connection.</div>'}
}

function render(){
  document.getElementById('list').innerHTML=members.map((m,i)=>`
    <div class="item ${checked.has(m.handle)?'on':''}" onclick="toggle('${m.handle}')">
      <div class="box">${checked.has(m.handle)?'✓':''}</div>
      <div class="info"><div class="iname">${m.name}</div><div class="ihandle">@${m.handle}</div></div>
      <div class="inum">${m.sessions}</div>
    </div>`).join('');
  const n=checked.size;
  document.getElementById('cnt').textContent=n+' checked in';
  document.getElementById('sbtn').disabled=n===0;
}

function toggle(h){checked.has(h)?checked.delete(h):checked.add(h);render()}

async function submit(){
  const btn=document.getElementById('sbtn');
  btn.textContent='Saving...';btn.disabled=true;
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'checkin',handles:Array.from(checked)})});
    const res=await r.json();
    queue=res.milestones||[];
    nextMilestone();
  }catch(e){btn.textContent='Error — try again';btn.disabled=false}
}

function nextMilestone(){
  document.getElementById('ov').classList.remove('show');
  if(queue.length===0){done();return}
  const m=queue.shift();
  const icons={'DYT Family':'⭐','DYT Shirt':'🔥','Full DYT Kit':'👑','Legendary':'🏆'};
  document.getElementById('ovIcon').textContent=icons[m.milestone]||'🏆';
  document.getElementById('ovTitle').textContent=m.name+' — '+m.sessions+' sessions!';
  document.getElementById('ovMsg').textContent='Milestone unlocked: '+m.milestone+'\n@'+m.handle;
  document.getElementById('ov').classList.add('show');
}

function done(){
  checked.clear();load();
  document.getElementById('sbtn').textContent='✓ Saved!';
  setTimeout(()=>{document.getElementById('sbtn').textContent='Save Session →'},2000);
}
</script>
</body>
</html>
